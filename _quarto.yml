project:
  type: book
  output-dir: docs
  pre-render: Rscript scripts/make_answers.R

book:
  title: "Business Statistics"
  author: "J. Alejandro Gelves"
  date: "09/6/2026"
  cover-image: cover.png
  google-analytics: "G-PLNY5BZ16X"
  output-file: "Business-Statistics"
  downloads: [pdf]
  search: true
  reader-mode: true
  page-navigation: true
  sidebar:
    style: floating
    collapse-level: 2
  page-footer:
    left: |
      Business Statistics · J. Alejandro Gelves
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>
  chapters:
    - index.qmd
    - part: "Describe"
      chapters:
        - DescriptiveI.qmd
        - DescriptiveII.qmd
        - DescriptiveIII.qmd
        - DescriptiveIV.qmd
        - DescriptiveV.qmd
    - part: "Relate"
      chapters:
        - RegressionI.qmd
        - RegressionII.qmd
    - part: "Uncertainty"
      chapters:
        - ProbabilityI.qmd
        - ProbabilityII.qmd
        - ProbabilityIII.qmd
    - part: "Infer"
      chapters:
        - InferenceI.qmd
        - InferenceII.qmd
        - InferenceIII.qmd
        - InfReg.qmd
    - part: "Toolkit"
      chapters:
        - Excel Basics.qmd
        - answers.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, styles/light.scss, styles/base.scss]
      dark: [cosmo, styles/dark.scss, styles/base.scss]
    respect-user-color-scheme: true
    include-in-header: custom-head.html
    include-after-body:
      text: |
        <script src="assets/book.js"></script>
    resources:
      - assets/book.js
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-copy: true
    smooth-scroll: true
    anchor-sections: true
    fig-align: center
  pdf:
    documentclass: scrreprt
    classoption: [oneside, open=any]
    pdf-engine: xelatex
    papersize: letter
    geometry: [top=0.95in, bottom=0.85in, left=1.1in, right=1.1in, headsep=0.3in]
    fontsize: 11pt
    linestretch: 1.15
    mainfont: texgyrepagella
    mainfontoptions: [Extension=.otf, UprightFont=*-regular, BoldFont=*-bold, ItalicFont=*-italic, BoldItalicFont=*-bolditalic]
    sansfont: texgyreheros
    sansfontoptions: [Extension=.otf, UprightFont=*-regular, BoldFont=*-bold, ItalicFont=*-italic, BoldItalicFont=*-bolditalic, Scale=MatchLowercase]
    monofont: lmmono10-regular.otf
    mathfont: texgyrepagella-math.otf
    colorlinks: true
    linkcolor: "bsaccent"
    urlcolor: "bsaccent"
    toccolor: "black"
    toc-depth: 1
    fig-pos: "H"
    fig-width: 6
    fig-height: 3.6
    include-in-header: pdf/preamble.tex

filters:
  - shinylive
  - pdf/pdf.lua
  - scripts/answers-link.lua

editor: visual
